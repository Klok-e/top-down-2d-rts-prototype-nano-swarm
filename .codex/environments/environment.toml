version = 1
name = "top-down-2d-rts-prototype-nano-swarm"

[setup]
script = '''
cd "${CODEX_WORKTREE_PATH:?}" || exit 1

main_checkout=$(git worktree list --porcelain | sed -n '1s/^worktree //p')
[ -n "$main_checkout" ] || exit 1
source_target="$main_checkout/target"
[ -d "$source_target" ] && [ ! -L "$source_target" ] || exit 0
[ ! -e target ] && [ ! -L target ] || exit 0

skip_if_cargo_running() {
    if pgrep -x cargo >/dev/null; then
        echo 'Cargo is running. Skipping worktree cache seeding.' >&2
        exit 0
    fi
}

skip_if_cargo_running
staging=$(mktemp -d .target-reflink.XXXXXX) || exit 1
trap 'rm -rf -- "$staging"' EXIT
if cp -a --reflink=always -T -- "$source_target" "$staging/target"; then
    skip_if_cargo_running
    mv -nT -- "$staging/target" target
else
    echo 'Cargo cache reflink failed. Cargo will create a fresh target directory.' >&2
fi
'''
